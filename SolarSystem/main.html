<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Main page</title>
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
        <meta http-equiv = "X-UA-Compatible" content="IE-edge">
        <link rel="icon" href="">
        <link href="main.css" rel="stylesheet">
        <link href="main3d.css" rel="stylesheet" disabled>
      </head>
      <body>
        <div class="wrapper">
            <div id="neptune" class="planet neptune-container selected-border" data-planet="neptune">
                <canvas class="neptune"></canvas>
            </div>
            <div id="uranus" class="planet uranus-container" data-planet="uranus">
                <canvas class="uranus"></canvas>
                <div class="uranus-orbit">
                  <div class="uranus-ring"></div>
                </div>
            </div>
            <div id="saturn" class="planet saturn-container" data-planet="saturn">
                <canvas class="saturn"></canvas>
                <div class="saturn-orbit">
                  <div class="saturn-ring"></div>
                </div>
            </div>
            <div id="jupiter" class="planet jupiter-container" data-planet="jupiter">
                <canvas class="jupiter"></canvas>
            </div>
            <div id="mars" class="planet mars-container" data-planet="mars">
                <canvas class="mars"></canvas>
            </div>
            <div id="earth" class="planet earth-container" data-planet="earth">
                <canvas class="earth"></canvas>
                <div class="earth-orbit">
                    <div class="moon-container">
                        <canvas class="earth-moon"></canvas>
                    </div>
                </div>
            </div>
            <div id="venus" class="planet venus-container" data-planet="venus">
                <canvas class="venus"></canvas>
            </div>
            <div id="mercury" class="planet mercury-container orbit" data-planet="mercury">
                <canvas class="mercury"></canvas>
            </div>
            <div class="planet sun-container" data-planet="sun">
                <canvas class="top-sun"></canvas>
                <canvas class="bottom-sun"></canvas>
            </div>
        </div>


        <!-- collapse -->
        <div class="btn-position">
          <button class="custom-btn" type="button" id="togglePanelBtn" aria-expanded="false" aria-controls="collapseWidthExample">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear" viewBox="0 0 16 16">
              <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0"/>
              <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z"/>
            </svg>
          </button>
          <div class="collapse-custom" id="collapseWidthExample">
            <div class="card-custom" style="width: 150px;">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="flexRadioDefault" id="changeView3D" checked>
                <label class="form-check-label" for="changeView3D">3D</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="flexRadioDefault" id="changeView2D">
                <label class="form-check-label" for="changeView2D">2D</label>
              </div>
            </div>
          </div>
        </div>


        <!-- Modal -->
        <div id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
          <div class="modal-custom">
            <div class="modal-dialog">
              <div class="modal-content-custom">
                <div class="modal-header">
                  <h1 class="modal-title" id="infoModalLabel">Modal title</h1>
                </div>
                <div class="modal-body">
                    <table class="table-custom">
                        <thead>
                          <tr>
                            <th scope="col"></th>
                            <th scope="col" id="value-style"></th>
                          </tr>
                        </thead>
                        <tbody id="modal-table-body">
                        </tbody>
                      </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </body>
      <script src="main.js" type="text/javascript"></script>

</html>
